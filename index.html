<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じぶん成長ノート 🌱</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap');
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_TEACHER_PASS = '0000';

    const INITIAL_STUDENTS = [
      { id: '1', name: '1. 児童1', avatar: '🌱', parentPass: '1234' },
      { id: '2', name: '2. 児童2', avatar: '🌱', parentPass: '1234' },
      { id: '3', name: '3. 児童3', avatar: '🌱', parentPass: '1234' },
      { id: '4', name: '4. 児童4', avatar: '🌱', parentPass: '1234' },
      { id: '5', name: '5. 児童5', avatar: '🌱', parentPass: '1234' },
      { id: '6', name: '6. 児童6', avatar: '🌱', parentPass: '1234' },
      { id: '7', name: '7. 児童7', avatar: '🌱', parentPass: '1234' },
      { id: '8', name: '8. 児童8', avatar: '🌱', parentPass: '1234' },
      { id: '9', name: '9. 児童9', avatar: '🌱', parentPass: '1234' },
      { id: '10', name: '10. 児童10', avatar: '🌱', parentPass: '1234' },
      { id: '11', name: '11. 児童11', avatar: '🌱', parentPass: '1234' },
      { id: '12', name: '12. 児童12', avatar: '🌱', parentPass: '1234' },
      { id: '13', name: '13. 児童13', avatar: '🌱', parentPass: '1234' },
      { id: '14', name: '14. 児童14', avatar: '🌱', parentPass: '1234' },
      { id: '15', name: '15. 児童15', avatar: '🌱', parentPass: '1234' },
      { id: '16', name: '16. 児童16', avatar: '🌱', parentPass: '1234' },
    ];

    const PLANT_STAGES = [
      { threshold: 0, name: 'たね・めばえ', icon: '🌱', desc: '挑戦の芽が出たよ！' },
      { threshold: 1, name: 'ふたば', icon: '🌿', desc: 'すくすく育ち始めたね！' },
      { threshold: 3, name: 'わかぎ', icon: '🪴', desc: 'しっかりと根を張ってきた！' },
      { threshold: 6, name: 'たいぼく', icon: '🌳', desc: '大きくて強い木になった！' },
      { threshold: 10, name: 'おおはな', icon: '🌸', desc: 'すばらしい花が咲いたよ！' }
    ];

    const INITIAL_RECORDS = {
      '1': {
        1: { kanjiTarget: 5, mathTarget: 4, strategy: '毎日寝る前に5分漢字ノートを見た！', kanjiResult: 6, mathResult: 5, reflection: '漢字の目標を達成できた！算数もがんばった。', teacherComment: '自分で目標を決めて毎日続ける姿勢が素晴らしいですね！' },
        2: { kanjiTarget: 6, mathTarget: 5, strategy: '間違えた問題をもう一回解き直す作戦！', kanjiResult: 7, mathResult: 6, reflection: '解き直し作戦が大成功した！', teacherComment: '作戦が見事に当たったね！素晴らしい工夫です。' },
      },
      '2': {
        1: { kanjiTarget: 8, mathTarget: 8, strategy: '朝起きてすぐに計算ドリルを1ページやる！', kanjiResult: 8, mathResult: 7, reflection: '算数があと1問で悔しかったけど次は届きそう！', teacherComment: '朝の集中力を生かした工夫が最高です！' },
      },
      '3': {
        1: { kanjiTarget: 3, mathTarget: 3, strategy: '声に出して読みながら漢字を書く！', kanjiResult: 4, mathResult: 3, reflection: '両方合格できてすごくうれしい！', teacherComment: '声に出す工夫、とても良いアイデアですね！' },
      }
    };

    function App() {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('growth_note_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [teacherPass, setTeacherPass] = useState(() => {
        const saved = localStorage.getItem('growth_note_teacher_pass');
        return saved || DEFAULT_TEACHER_PASS;
      });

      const [mode, setMode] = useState('student');
      const [teacherTab, setTeacherTab] = useState('dashboard'); // 'dashboard' | 'settings'
      const [currentWeek, setCurrentWeek] = useState(3);
      const [phase, setPhase] = useState('declaration');
      const [selectedStudentId, setSelectedStudentId] = useState('1');

      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('growth_note_records');
        return saved ? JSON.parse(saved) : INITIAL_RECORDS;
      });

      const [parentPassInput, setParentPassInput] = useState('');
      const [isParentAuth, setIsParentAuth] = useState(false);
      const [newParentPassInput, setNewParentPassInput] = useState('');

      const [teacherPassInput, setTeacherPassInput] = useState('');
      const [isTeacherAuth, setIsTeacherAuth] = useState(false);

      const [kanjiTarget, setKanjiTarget] = useState(5);
      const [mathTarget, setMathTarget] = useState(5);
      const [strategy, setStrategy] = useState('');
      const [kanjiResult, setKanjiResult] = useState(5);
      const [mathResult, setMathResult] = useState(5);
      const [reflection, setReflection] = useState('');

      // 設定管理用ステート
      const [newTeacherPass, setNewTeacherPass] = useState('');
      const [newStudentName, setNewStudentName] = useState('');
      const [newStudentParentPass, setNewStudentParentPass] = useState('1234');
      const [editingStudentId, setEditingStudentId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editPass, setEditPass] = useState('');

      useEffect(() => {
        localStorage.setItem('growth_note_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('growth_note_teacher_pass', teacherPass);
      }, [teacherPass]);

      useEffect(() => {
        localStorage.setItem('growth_note_records', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        setIsParentAuth(false);
        setParentPassInput('');
        setNewParentPassInput('');
        setIsTeacherAuth(false);
        setTeacherPassInput('');
      }, [selectedStudentId, mode]);

      useEffect(() => {
        const currentRec = records[selectedStudentId]?.[currentWeek];
        if (currentRec) {
          setKanjiTarget(currentRec.kanjiTarget ?? 5);
          setMathTarget(currentRec.mathTarget ?? 5);
          setStrategy(currentRec.strategy ?? '');
          setKanjiResult(currentRec.kanjiResult ?? 5);
          setMathResult(currentRec.mathResult ?? 5);
          setReflection(currentRec.reflection ?? '');
        } else {
          setKanjiTarget(5);
          setMathTarget(5);
          setStrategy('');
          setKanjiResult(5);
          setMathResult(5);
          setReflection('');
        }
      }, [selectedStudentId, currentWeek, records]);

      const getPassedCount = (studentId) => {
        const studentRecs = records[studentId] || {};
        let passed = 0;
        Object.values(studentRecs).forEach(rec => {
          if (rec.kanjiResult !== undefined && rec.kanjiResult >= rec.kanjiTarget) passed++;
          if (rec.mathResult !== undefined && rec.mathResult >= rec.mathTarget) passed++;
        });
        return passed;
      };

      const getGrowthStage = (passedCount) => {
        let currentStage = PLANT_STAGES[0];
        for (let stage of PLANT_STAGES) {
          if (passedCount >= stage.threshold) currentStage = stage;
        }
        return currentStage;
      };

      const handleSaveDeclaration = () => {
        setRecords(prev => ({
          ...prev,
          [selectedStudentId]: {
            ...prev[selectedStudentId],
            [currentWeek]: {
              ...prev[selectedStudentId]?.[currentWeek],
              kanjiTarget, mathTarget, strategy
            }
          }
        }));
        alert('目標と作戦を記録しました！');
      };

      const handleSaveResult = () => {
        setRecords(prev => ({
          ...prev,
          [selectedStudentId]: {
            ...prev[selectedStudentId],
            [currentWeek]: {
              ...prev[selectedStudentId]?.[currentWeek],
              kanjiResult, mathResult, reflection
            }
          }
        }));
        alert('結果と振り返りを保存しました！');
      };

      // 先生パスワード変更
      const handleChangeTeacherPass = () => {
        if (!newTeacherPass.trim()) {
          alert('新しいパスワードを入力してください');
          return;
        }
        setTeacherPass(newTeacherPass.trim());
        setNewTeacherPass('');
        alert('先生パスワードを変更しました！');
      };

      // 児童の新規追加
      const handleAddStudent = () => {
        if (!newStudentName.trim()) {
          alert('児童名を入力してください');
          return;
        }
        const newId = String(Date.now());
        const newSt = {
          id: newId,
          name: newStudentName.trim(),
          avatar: '🌱',
          parentPass: newStudentParentPass.trim() || '1234'
        };
        setStudents(prev => [...prev, newSt]);
        setNewStudentName('');
        setNewStudentParentPass('1234');
        alert(`${newSt.name} さんを追加しました！`);
      };

      // 児童の編集開始
      const startEditStudent = (st) => {
        setEditingStudentId(st.id);
        setEditName(st.name);
        setEditPass(st.parentPass);
      };

      // 児童の編集保存
      const handleSaveEditStudent = (id) => {
        if (!editName.trim()) {
          alert('名前を入力してください');
          return;
        }
        setStudents(prev => prev.map(st => 
          st.id === id ? { ...st, name: editName.trim(), parentPass: editPass.trim() || '1234' } : st
        ));
        setEditingStudentId(null);
        alert('児童情報・保護者PASSを更新しました！');
      };

      // 保護者自身による保護者PASS変更
      const handleSelfChangeParentPass = () => {
        if (!newParentPassInput.trim()) {
          alert('新しい保護者用パスワードを入力してください');
          return;
        }
        setStudents(prev => prev.map(st => 
          st.id === selectedStudentId ? { ...st, parentPass: newParentPassInput.trim() } : st
        ));
        setNewParentPassInput('');
        alert('保護者用パスワードを変更しました！');
      };

      // 児童の削除
      const handleDeleteStudent = (id, name) => {
        if (confirm(`${name} さんをリストから削除しますか？`)) {
          setStudents(prev => prev.filter(st => st.id !== id));
          if (selectedStudentId === id) {
            const remaining = students.filter(st => st.id !== id);
            if (remaining.length > 0) setSelectedStudentId(remaining[0].id);
          }
        }
      };

      const currentStudent = students.find(s => s.id === selectedStudentId) || students[0] || { id: '0', name: 'なし', avatar: '🌱', parentPass: '1234' };
      const currentGrowth = getGrowthStage(getPassedCount(selectedStudentId));

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-12">
          {}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🌱</span>
                <div>
                  <h1 className="font-bold text-lg text-slate-800 leading-tight">じぶん成長ノート</h1>
                  <p className="text-xs text-slate-500">自分だけの目標で、着実に芽を育てよう</p>
                </div>
              </div>

              <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                <button
                  onClick={() => setMode('student')}
                  className={`px-3 py-1.5 rounded-lg transition-all ${mode === 'student' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600'}`}
                >
                  📖 じぶん（児童）
                </button>
                <button
                  onClick={() => setMode('parent')}
                  className={`px-3 py-1.5 rounded-lg transition-all ${mode === 'parent' ? 'bg-white text-amber-700 shadow-sm' : 'text-slate-600'}`}
                >
                  ❤️ おうちの方
                </button>
                <button
                  onClick={() => setMode('teacher')}
                  className={`px-3 py-1.5 rounded-lg transition-all ${mode === 'teacher' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600'}`}
                >
                  👨‍🏫 せんせい
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 mt-6">
            {mode !== 'teacher' && (
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <span className="text-xs font-bold text-slate-500">児童を選択:</span>
                  <select
                    value={selectedStudentId}
                    onChange={(e) => setSelectedStudentId(e.target.value)}
                    className="w-full sm:w-64 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none"
                  >
                    {students.map(st => (
                      <option key={st.id} value={st.id}>{st.name} ({st.avatar})</option>
                    ))}
                  </select>
                </div>
                <div className="text-xs font-bold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-lg">
                  第 {currentWeek} 回
                </div>
              </div>
            )}

            {/* 児童画面 */}
            {mode === 'student' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-3xl p-6 text-white shadow-md flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl">
                      {currentGrowth.icon}
                    </div>
                    <div>
                      <span className="text-xs bg-white/20 px-2 py-0.5 rounded-full font-bold">{currentStudent.name} さんの成長</span>
                      <h2 className="text-2xl font-black">{currentGrowth.name}</h2>
                      <p className="text-xs text-emerald-100 mt-0.5">{currentGrowth.desc}</p>
                    </div>
                  </div>
                  <div className="bg-white/10 p-3 rounded-2xl text-center min-w-[140px]">
                    <p className="text-[10px] text-emerald-100">クリア回数</p>
                    <p className="text-2xl font-black">{getPassedCount(selectedStudentId)} 回</p>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => setPhase('declaration')}
                    className={`flex-1 py-3 rounded-2xl font-bold text-xs ${phase === 'declaration' ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-600 border'}`}
                  >
                    💡 1. 目標と作戦をたてる
                  </button>
                  <button
                    onClick={() => setPhase('result')}
                    className={`flex-1 py-3 rounded-2xl font-bold text-xs ${phase === 'result' ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border'}`}
                  >
                    🏆 2. 結果と振り返り
                  </button>
                </div>

                {phase === 'declaration' && (
                  <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <h3 className="font-bold text-slate-800 text-sm border-b pb-2">第 {currentWeek} 回 小テストの合格目標（自分で設定）</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="bg-emerald-50 p-4 rounded-2xl space-y-2">
                        <div className="flex justify-between text-xs font-bold">
                          <span>📝 漢字（10問中）</span>
                          <span className="text-emerald-700">{kanjiTarget} 問合格</span>
                        </div>
                        <input type="range" min="1" max="10" value={kanjiTarget} onChange={e => setKanjiTarget(Number(e.target.value))} className="w-full accent-emerald-600" />
                      </div>
                      <div className="bg-teal-50 p-4 rounded-2xl space-y-2">
                        <div className="flex justify-between text-xs font-bold">
                          <span>🔢 算数（10問中）</span>
                          <span className="text-teal-700">{mathTarget} 問合格</span>
                        </div>
                        <input type="range" min="1" max="10" value={mathTarget} onChange={e => setMathTarget(Number(e.target.value))} className="w-full accent-teal-600" />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="font-bold text-xs text-slate-700">✨ 合格するためのじぶん作戦・工夫</label>
                      <textarea
                        value={strategy}
                        onChange={e => setStrategy(e.target.value)}
                        placeholder="例：朝10分だけやる！間違えた漢字は3回書く！"
                        className="w-full p-3 border border-slate-200 rounded-2xl text-xs h-20 outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>

                    <button onClick={handleSaveDeclaration} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-2xl text-xs shadow-md">
                      作戦を決定してがんばる！
                    </button>
                  </div>
                )}

                {phase === 'result' && (
                  <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <h3 className="font-bold text-slate-800 text-sm border-b pb-2">第 {currentWeek} 回 テスト結果の記録</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="bg-slate-50 p-4 rounded-2xl border space-y-2">
                        <span className="text-xs font-bold">📝 漢字の結果 (目標: {kanjiTarget}問)</span>
                        <div className="flex items-center gap-2">
                          <input type="number" min="0" max="10" value={kanjiResult} onChange={e => setKanjiResult(Number(e.target.value))} className="w-16 p-2 border rounded-xl text-center font-bold text-base" />
                          <span className="text-xs font-bold">問正解</span>
                        </div>
                      </div>
                      <div className="bg-slate-50 p-4 rounded-2xl border space-y-2">
                        <span className="text-xs font-bold">🔢 算数の結果 (目標: {mathTarget}問)</span>
                        <div className="flex items-center gap-2">
                          <input type="number" min="0" max="10" value={mathResult} onChange={e => setMathResult(Number(e.target.value))} className="w-16 p-2 border rounded-xl text-center font-bold text-base" />
                          <span className="text-xs font-bold">問正解</span>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="font-bold text-xs text-slate-700">😊 今回の振り返り</label>
                      <textarea
                        value={reflection}
                        onChange={e => setReflection(e.target.value)}
                        placeholder="作戦通りに勉強できた！次は目標を上げてみよう！"
                        className="w-full p-3 border border-slate-200 rounded-2xl text-xs h-20 outline-none focus:ring-2 focus:ring-teal-500"
                      />
                    </div>

                    <button onClick={handleSaveResult} className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-2xl text-xs shadow-md">
                      結果を記録する
                    </button>
                  </div>
                )}

                {/* 先生コメント */}
                {records[selectedStudentId]?.[currentWeek]?.teacherComment && (
                  <div className="bg-amber-50 rounded-3xl p-4 border border-amber-200 flex items-start gap-3">
                    <span className="text-2xl">👨‍🏫</span>
                    <div>
                      <h4 className="font-bold text-xs text-amber-900">せんせいからのメッセージ</h4>
                      <p className="text-xs text-amber-800 mt-1">{records[selectedStudentId][currentWeek].teacherComment}</p>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 保護者画面 */}
            {mode === 'parent' && (
              <div className="space-y-6">
                {!isParentAuth ? (
                  <div className="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-sm border space-y-4 my-8">
                    <h3 className="font-bold text-slate-800 text-center">{currentStudent.name} さんの保護者確認</h3>
                    <input
                      type="password"
                      value={parentPassInput}
                      onChange={e => setParentPassInput(e.target.value)}
                      placeholder={`パスワードを入力`}
                      className="w-full p-3 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-amber-500"
                    />
                    <button
                      onClick={() => parentPassInput === currentStudent.parentPass ? setIsParentAuth(true) : alert('パスワードが違います')}
                      className="w-full bg-amber-600 text-white font-bold py-3 rounded-xl text-xs"
                    >
                      確認画面に入る
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-white rounded-3xl p-6 shadow-sm border space-y-4">
                      <h2 className="font-bold text-base border-b pb-2">{currentStudent.name} さんの成長記録</h2>
                      <p className="text-xs text-slate-600">現在ステージ: <strong>{currentGrowth.icon} {currentGrowth.name}</strong></p>
                      <div className="space-y-2">
                        {[1, 2, 3].map(w => {
                          const rec = records[selectedStudentId]?.[w];
                          if (!rec) return null;
                          return (
                            <div key={w} className="p-3 bg-slate-50 rounded-2xl border text-xs space-y-1">
                              <span className="font-bold text-emerald-700">第 {w} 回</span>
                              <p>漢字: 目標{rec.kanjiTarget}問 ➔ 結果{rec.kanjiResult ?? '未'}問</p>
                              <p>算数: 目標{rec.mathTarget}問 ➔ 結果{rec.mathResult ?? '未'}問</p>
                              {rec.strategy && <p className="text-slate-500">作戦: {rec.strategy}</p>}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* オンライン保護者PASS変更エリア */}
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-amber-100 space-y-3">
                      <h3 className="font-bold text-xs text-amber-900 border-b pb-2">🔑 保護者用パスワードの変更</h3>
                      <p className="text-[11px] text-slate-500">ご家庭用に任意のパスワードへ変更できます。</p>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={newParentPassInput}
                          onChange={e => setNewParentPassInput(e.target.value)}
                          placeholder="新しいパスワードを入力"
                          className="p-2.5 border border-slate-200 rounded-xl text-xs flex-1 outline-none focus:ring-2 focus:ring-amber-500"
                        />
                        <button
                          onClick={handleSelfChangeParentPass}
                          className="px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-xs transition-all"
                        >
                          変更保存
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {}
            {/* 先生画面 */}
            {mode === 'teacher' && (
              <div className="space-y-6">
                {!isTeacherAuth ? (
                  <div className="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-sm border space-y-4 my-8">
                    <h3 className="font-bold text-slate-800 text-center">先生用画面 ログイン</h3>
                    <input
                      type="password"
                      value={teacherPassInput}
                      onChange={e => setTeacherPassInput(e.target.value)}
                      placeholder="先生用パスワードを入力"
                      className="w-full p-3 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                    <button
                      onClick={() => teacherPassInput === teacherPass ? setIsTeacherAuth(true) : alert('パスワードが違います')}
                      className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs"
                    >
                      ログイン
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {/* 先生画面サブタブ */}
                    <div className="flex gap-2 border-b pb-2">
                      <button
                        onClick={() => setTeacherTab('dashboard')}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                          teacherTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 border'
                        }`}
                      >
                        📊 学習ダッシュボード
                      </button>
                      <button
                        onClick={() => setTeacherTab('settings')}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                          teacherTab === 'settings' ? 'bg-teal-600 text-white' : 'bg-white text-slate-600 border'
                        }`}
                      >
                        ⚙️ 児童・パスワード設定
                      </button>
                    </div>

                    {/* ダッシュボードタブ */}
                    {teacherTab === 'dashboard' && (
                      <div className="bg-white p-6 rounded-3xl shadow-sm border space-y-4">
                        <div className="flex justify-between items-center border-b pb-3">
                          <h2 className="font-bold text-base">学級全児童の学習ダッシュボード</h2>
                          <div className="flex items-center gap-2 text-xs">
                            <button onClick={() => setCurrentWeek(Math.max(1, currentWeek - 1))} className="px-2 py-1 bg-slate-100 rounded">◀ 前</button>
                            <span className="font-bold">第 {currentWeek} 回</span>
                            <button onClick={() => setCurrentWeek(currentWeek + 1)} className="px-2 py-1 bg-slate-100 rounded">次 ▶</button>
                          </div>
                        </div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead>
                              <tr className="bg-slate-100 text-slate-700 font-bold">
                                <th className="p-2">名前</th>
                                <th className="p-2">漢字</th>
                                <th className="p-2">算数</th>
                                <th className="p-2">作戦</th>
                                <th className="p-2">振り返り</th>
                                <th className="p-2 text-center">コメント</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {students.map(st => {
                                const rec = records[st.id]?.[currentWeek] || {};
                                return (
                                  <tr key={st.id}>
                                    <td className="p-2 font-bold">{st.name}</td>
                                    <td className="p-2">{rec.kanjiTarget ? `${rec.kanjiTarget} ➔ ${rec.kanjiResult ?? '未'}` : '-'}</td>
                                    <td className="p-2">{rec.mathTarget ? `${rec.mathTarget} ➔ ${rec.mathResult ?? '未'}` : '-'}</td>
                                    <td className="p-2 max-w-[150px] truncate">{rec.strategy || '-'}</td>
                                    <td className="p-2 max-w-[150px] truncate">{rec.reflection || '-'}</td>
                                    <td className="p-2 text-center">
                                      <button
                                        onClick={() => {
                                          const msg = prompt(`${st.name} さんへのメッセージ:`, rec.teacherComment || '');
                                          if (msg !== null) {
                                            setRecords(prev => ({
                                              ...prev,
                                              [st.id]: {
                                                ...prev[st.id],
                                                [currentWeek]: { ...prev[st.id]?.[currentWeek], teacherComment: msg }
                                              }
                                            }));
                                          }
                                        }}
                                        className="px-2 py-1 bg-emerald-50 text-emerald-700 rounded border text-[10px] font-bold"
                                      >
                                        {rec.teacherComment ? '📝 編集' : '➕ 追加'}
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* 設定タブ（パスワード・児童名編集） */}
                    {teacherTab === 'settings' && (
                      <div className="space-y-6">
                        {/* 先生パスワード変更 */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                          <h3 className="font-bold text-sm border-b pb-2 text-slate-800">🔑 先生用パスワードの変更</h3>
                          <div className="flex gap-2 items-center max-w-md">
                            <input
                              type="password"
                              value={newTeacherPass}
                              onChange={e => setNewTeacherPass(e.target.value)}
                              placeholder="新しい先生用パスワードを入力"
                              className="p-2.5 border rounded-xl text-xs flex-1 outline-none focus:ring-2 focus:ring-teal-500"
                            />
                            <button
                              onClick={handleChangeTeacherPass}
                              className="px-4 py-2.5 bg-teal-600 text-white font-bold rounded-xl text-xs hover:bg-teal-700"
                            >
                              変更保存
                            </button>
                          </div>
                        </div>

                        {/* 新規児童追加 */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                          <h3 className="font-bold text-sm border-b pb-2 text-slate-800">➕ 新しい児童の追加</h3>
                          <div className="flex flex-wrap gap-2 items-center">
                            <input
                              type="text"
                              value={newStudentName}
                              onChange={e => setNewStudentName(e.target.value)}
                              placeholder="児童のお名前（例: たろう）"
                              className="p-2.5 border rounded-xl text-xs flex-1 min-w-[150px] outline-none focus:ring-2 focus:ring-emerald-500"
                            />
                            <input
                              type="text"
                              value={newStudentParentPass}
                              onChange={e => setNewStudentParentPass(e.target.value)}
                              placeholder="保護者パスワード (例: 1234)"
                              className="p-2.5 border rounded-xl text-xs w-36 outline-none focus:ring-2 focus:ring-emerald-500"
                            />
                            <button
                              onClick={handleAddStudent}
                              className="px-4 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs hover:bg-emerald-700"
                            >
                              追加する
                            </button>
                          </div>
                        </div>

                        {/* 児童名簿・保護者パスワード編集・削除 */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                          <h3 className="font-bold text-sm border-b pb-2 text-slate-800">📝 児童名簿・保護者パスワードの編集</h3>
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                              <thead>
                                <tr className="bg-slate-100 font-bold text-slate-700">
                                  <th className="p-2.5">児童名</th>
                                  <th className="p-2.5">保護者用パスワード</th>
                                  <th className="p-2.5 text-center">操作</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {students.map(st => (
                                  <tr key={st.id} className="hover:bg-slate-50">
                                    <td className="p-2.5 font-bold">
                                      {editingStudentId === st.id ? (
                                        <input
                                          type="text"
                                          value={editName}
                                          onChange={e => setEditName(e.target.value)}
                                          className="p-1 border rounded text-xs w-32"
                                        />
                                      ) : (
                                        <span>{st.name}</span>
                                      )}
                                    </td>
                                    <td className="p-2.5">
                                      {editingStudentId === st.id ? (
                                        <input
                                          type="text"
                                          value={editPass}
                                          onChange={e => setEditPass(e.target.value)}
                                          className="p-1 border rounded text-xs w-28"
                                        />
                                      ) : (
                                        <span className="font-mono bg-slate-100 px-2 py-0.5 rounded text-slate-700">{st.parentPass}</span>
                                      )}
                                    </td>
                                    <td className="p-2.5 text-center">
                                      {editingStudentId === st.id ? (
                                        <div className="flex justify-center gap-1">
                                          <button
                                            onClick={() => handleSaveEditStudent(st.id)}
                                            className="px-2 py-1 bg-emerald-600 text-white rounded text-[10px] font-bold"
                                          >
                                            保存
                                          </button>
                                          <button
                                            onClick={() => setEditingStudentId(null)}
                                            className="px-2 py-1 bg-slate-200 text-slate-700 rounded text-[10px]"
                                          >
                                            キャンセル
                                          </button>
                                        </div>
                                      ) : (
                                        <div className="flex justify-center gap-1">
                                          <button
                                            onClick={() => startEditStudent(st)}
                                            className="px-2 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded text-[10px] font-bold hover:bg-amber-100"
                                          >
                                            編集
                                          </button>
                                          <button
                                            onClick={() => handleDeleteStudent(st.id, st.name)}
                                            className="px-2 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded text-[10px] font-bold hover:bg-rose-100"
                                          >
                                            削除
                                          </button>
                                        </div>
                                      )}
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
