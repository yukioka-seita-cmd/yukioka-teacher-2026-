<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じぶん成長ノート 🌱</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap');
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons Components
    const Icons = {
      Lock: () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>,
      UserCheck: () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
      Sparkles: () => <svg className="w-4 h-4 inline-block text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
      Award: () => <svg className="w-5 h-5 inline-block text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15l-2 5l9-5l-9-5l2 5zm0 0l-8-4l8-4l8 4l-8 4z" /></svg>,
      BookOpen: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>,
      Heart: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.684a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>,
      Smile: () => <svg className="w-4 h-4 inline-block text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Send: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
      Users: () => <svg className="w-4 h-4 inline-block text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
      CheckCircle2: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Lightbulb: () => <svg className="w-4 h-4 inline-block text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>,
      GraduationCap: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" /></svg>,
      Settings: () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Key: () => <svg className="w-4 h-4 inline-block text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
    };

    // 16名分 初期データ
    const DEFAULT_STUDENTS = Array.from({ length: 16 }, (_, i) => ({
      id: String(i + 1),
      name: `${i + 1}番 児童`,
      avatar: '🌱',
      parentPass: '1234'
    }));

    const PLANT_STAGES = [
      { threshold: 0, name: 'たね・めばえ', icon: '🌱', desc: '挑戦の芽が出たよ！' },
      { threshold: 1, name: 'ふたば', icon: '🌿', desc: 'すくすく育ち始めたね！' },
      { threshold: 3, name: 'わかぎ', icon: '🪴', desc: 'しっかりと根を張ってきた！' },
      { threshold: 6, name: 'たいぼく', icon: '🌳', desc: '大きくて強い木になった！' },
      { threshold: 10, name: 'おおはな', icon: '🌸', desc: 'すばらしい花が咲いたよ！' }
    ];

    function App() {
      const [mode, setMode] = useState('student'); // 'student' | 'parent' | 'teacher'
      const [teacherTab, setTeacherTab] = useState('dashboard'); // 'dashboard' | 'settings'
      const [currentWeek, setCurrentWeek] = useState(1); // 初期表示は第1回
      const [phase, setPhase] = useState('declaration'); // 'declaration' | 'result'
      
      // データ永続化 (localStorage)
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('growth_note_students');
        return saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
      });

      const [teacherPass, setTeacherPass] = useState(() => {
        return localStorage.getItem('growth_note_teacher_pass') || '0000';
      });

      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('growth_note_records');
        return saved ? JSON.parse(saved) : {};
      });

      const [selectedStudentId, setSelectedStudentId] = useState('1');
      const [parentPassInput, setParentPassInput] = useState('');
      const [isParentAuth, setIsParentAuth] = useState(false);

      const [teacherPassInput, setTeacherPassInput] = useState('');
      const [isTeacherAuth, setIsTeacherAuth] = useState(false);

      // フォーム用ステート
      const [kanjiTarget, setKanjiTarget] = useState(5);
      const [mathTarget, setMathTarget] = useState(5);
      const [strategy, setStrategy] = useState('');
      const [kanjiResult, setKanjiResult] = useState(5);
      const [mathResult, setMathResult] = useState(5);
      const [reflection, setReflection] = useState('');

      // 先生用コメント入力
      const [teacherCommentInput, setTeacherCommentInput] = useState('');
      const [editingStudentId, setEditingStudentId] = useState(null);

      // 設定管理用
      const [newTeacherPass, setNewTeacherPass] = useState('');

      useEffect(() => {
        localStorage.setItem('growth_note_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('growth_note_teacher_pass', teacherPass);
      }, [teacherPass]);

      useEffect(() => {
        localStorage.setItem('growth_note_records', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        setIsParentAuth(false);
        setParentPassInput('');
        setIsTeacherAuth(false);
        setTeacherPassInput('');
      }, [selectedStudentId, mode]);

      useEffect(() => {
        const currentRec = records[selectedStudentId]?.[currentWeek];
        if (currentRec) {
          setKanjiTarget(currentRec.kanjiTarget ?? 5);
          setMathTarget(currentRec.mathTarget ?? 5);
          setStrategy(currentRec.strategy ?? '');
          setKanjiResult(currentRec.kanjiResult ?? 5);
          setMathResult(currentRec.mathResult ?? 5);
          setReflection(currentRec.reflection ?? '');
        } else {
          setKanjiTarget(5);
          setMathTarget(5);
          setStrategy('');
          setKanjiResult(5);
          setMathResult(5);
          setReflection('');
        }
      }, [selectedStudentId, currentWeek, records]);

      const handleTeacherAuth = () => {
        if (teacherPassInput === teacherPass) {
          setIsTeacherAuth(true);
        } else {
          alert('パスワードが違います');
        }
      };

      const handleParentAuth = () => {
        const student = students.find(s => s.id === selectedStudentId);
        if (student && parentPassInput === student.parentPass) {
          setIsParentAuth(true);
        } else {
          alert('パスワードが違います');
        }
      };

      const getPassedCount = (studentId) => {
        const studentRecs = records[studentId] || {};
        let passed = 0;
        Object.values(studentRecs).forEach(rec => {
          if (rec.kanjiResult !== undefined && rec.kanjiResult >= rec.kanjiTarget) passed++;
          if (rec.mathResult !== undefined && rec.mathResult >= rec.mathTarget) passed++;
        });
        return passed;
      };

      const getGrowthStage = (passedCount) => {
        let currentStage = PLANT_STAGES[0];
        for (let stage of PLANT_STAGES) {
          if (passedCount >= stage.threshold) {
            currentStage = stage;
          }
        }
        return currentStage;
      };

      const handleSaveDeclaration = () => {
        setRecords(prev => {
          const studentRecs = prev[selectedStudentId] || {};
          const weekRec = studentRecs[currentWeek] || {};
          return {
            ...prev,
            [selectedStudentId]: {
              ...studentRecs,
              [currentWeek]: {
                ...weekRec,
                kanjiTarget,
                mathTarget,
                strategy
              }
            }
          };
        });
        alert('目標と作戦を記録しました！');
      };

      const handleSaveResult = () => {
        setRecords(prev => {
          const studentRecs = prev[selectedStudentId] || {};
          const weekRec = studentRecs[currentWeek] || {};
          return {
            ...prev,
            [selectedStudentId]: {
              ...studentRecs,
              [currentWeek]: {
                ...weekRec,
                kanjiResult,
                mathResult,
                reflection
              }
            }
          };
        });
        alert('結果と振り返りを保存しました！');
      };

      const handleSaveTeacherComment = (studentId) => {
        setRecords(prev => {
          const studentRecs = prev[studentId] || {};
          const weekRec = studentRecs[currentWeek] || {};
          return {
            ...prev,
            [studentId]: {
              ...studentRecs,
              [currentWeek]: {
                ...weekRec,
                teacherComment: teacherCommentInput
              }
            }
          };
        });
        setEditingStudentId(null);
        setTeacherCommentInput('');
      };

      const handleUpdateStudentInfo = (id, newName, newPass) => {
        setStudents(prev => prev.map(st => st.id === id ? { ...st, name: newName, parentPass: newPass } : st));
      };

      const handleUpdateTeacherPass = () => {
        if (!newTeacherPass.trim()) {
          alert('新しいパスワードを入力してください');
          return;
        }
        setTeacherPass(newTeacherPass.trim());
        setNewTeacherPass('');
        alert('先生用パスワードを変更しました');
      };

      const currentStudent = students.find(s => s.id === selectedStudentId) || students[0];
      const currentGrowth = getGrowthStage(getPassedCount(selectedStudentId));

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">
          {/* ヘッダー */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🌱</span>
                <div>
                  <h1 className="font-bold text-lg text-slate-800 leading-tight">じぶん成長ノート</h1>
                  <p className="text-xs text-slate-500">自分だけの目標で、着実に芽を育てよう</p>
                </div>
              </div>

              {/* モード切り替え */}
              <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                <button
                  onClick={() => setMode('student')}
                  className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 ${
                    mode === 'student' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icons.BookOpen />
                  じぶん（児童）
                </button>
                <button
                  onClick={() => setMode('parent')}
                  className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 ${
                    mode === 'parent' ? 'bg-white text-amber-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icons.Heart />
                  おうちの方（保護者）
                </button>
                <button
                  onClick={() => setMode('teacher')}
                  className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 ${
                    mode === 'teacher' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icons.GraduationCap />
                  せんせい
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 mt-6">
            {/* 児童選択バー */}
            {mode !== 'teacher' && (
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <span className="text-xs font-bold text-slate-500 whitespace-nowrap">児童を選択:</span>
                  <select
                    value={selectedStudentId}
                    onChange={(e) => setSelectedStudentId(e.target.value)}
                    className="w-full sm:w-64 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none cursor-pointer"
                  >
                    {students.map(st => (
                      <option key={st.id} value={st.id}>
                        {st.id}. {st.avatar} {st.name}
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex items-center gap-2 text-xs self-end sm:self-auto">
                  <span className="text-slate-500">いまの回:</span>
                  <span className="font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg">
                    第 {currentWeek} 回
                  </span>
                </div>
              </div>
            )}

            {/* 児童画面 */}
            {mode === 'student' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-3xl p-6 text-white shadow-md relative overflow-hidden">
                  <div className="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div className="flex items-center gap-4">
                      <div className="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-5xl shadow-inner">
                        {currentGrowth.icon}
                      </div>
                      <div>
                        <div className="inline-block px-3 py-0.5 rounded-full bg-white/20 text-xs font-bold mb-1">
                          {currentStudent.avatar} {currentStudent.name} さんの成長ステージ
                        </div>
                        <h2 className="text-2xl font-black">{currentGrowth.name}</h2>
                        <p className="text-xs text-emerald-100 mt-1">{currentGrowth.desc}</p>
                      </div>
                    </div>

                    <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl text-center min-w-[200px]">
                      <p className="text-xs text-emerald-100 mb-1">これまでのクリア回数</p>
                      <p className="text-3xl font-black">{getPassedCount(selectedStudentId)} <span className="text-sm font-normal">回</span></p>
                    </div>
                  </div>
                </div>

                {/* フェーズ切替 */}
                <div className="flex gap-3">
                  <button
                    onClick={() => setPhase('declaration')}
                    className={`flex-1 py-3 px-4 rounded-2xl font-bold text-xs transition-all flex items-center justify-center gap-2 ${
                      phase === 'declaration' ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    <Icons.Lightbulb />
                    1. 今週の目標と作戦をたてる
                  </button>
                  <button
                    onClick={() => setPhase('result')}
                    className={`flex-1 py-3 px-4 rounded-2xl font-bold text-xs transition-all flex items-center justify-center gap-2 ${
                      phase === 'result' ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'
                    }`}
                  >
                    <Icons.Award />
                    2. 結果と振り返りを記録する
                  </button>
                </div>

                {/* フェーズ1 */}
                {phase === 'declaration' && (
                  <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div>
                      <h3 className="font-bold text-slate-800 flex items-center gap-2 text-base border-b pb-3 mb-4">
                        <Icons.Lightbulb />
                        第 {currentWeek} 回 小テストの合格目標（自分で決める！）
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-emerald-50/60 p-4 rounded-2xl border border-emerald-100 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-700 text-xs">📝 漢字小テスト（10問中）</span>
                            <span className="text-lg font-black text-emerald-700">{kanjiTarget} 問合格</span>
                          </div>
                          <input
                            type="range"
                            min="1"
                            max="10"
                            value={kanjiTarget}
                            onChange={(e) => setKanjiTarget(Number(e.target.value))}
                            className="w-full accent-emerald-600"
                          />
                        </div>

                        <div className="bg-teal-50/60 p-4 rounded-2xl border border-teal-100 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-700 text-xs">🔢 算数小テスト（10問中）</span>
                            <span className="text-lg font-black text-teal-700">{mathTarget} 問合格</span>
                          </div>
                          <input
                            type="range"
                            min="1"
                            max="10"
                            value={mathTarget}
                            onChange={(e) => setMathTarget(Number(e.target.value))}
                            className="w-full accent-teal-600"
                          />
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <label className="font-bold text-xs text-slate-700 block flex items-center gap-1.5">
                        <Icons.Sparkles />
                        合格するためのじぶん作戦・工夫
                      </label>
                      <textarea
                        value={strategy}
                        onChange={(e) => setStrategy(e.target.value)}
                        placeholder="例：朝起きてすぐ10分だけやる！間違えた漢字は３回書く！など"
                        className="w-full p-3 border border-slate-200 rounded-2xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none h-24"
                      />
                    </div>

                    <button
                      onClick={handleSaveDeclaration}
                      className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-2xl text-xs transition-all shadow-md flex items-center justify-center gap-2"
                    >
                      <Icons.Send />
                      作戦を決定してがんばる！
                    </button>
                  </div>
                )}

                {/* フェーズ2 */}
                {phase === 'result' && (
                  <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div>
                      <h3 className="font-bold text-slate-800 flex items-center gap-2 text-base border-b pb-3 mb-4">
                        <Icons.Award />
                        第 {currentWeek} 回 テスト結果の記録
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-700 text-xs">📝 漢字の結果</span>
                            <span className="text-xs text-slate-500">目標: {kanjiTarget}問</span>
                          </div>
                          <div className="flex items-center gap-3">
                            <input
                              type="number"
                              min="0"
                              max="10"
                              value={kanjiResult}
                              onChange={(e) => setKanjiResult(Number(e.target.value))}
                              className="w-20 p-2 text-center border border-slate-300 rounded-xl font-bold text-lg outline-none"
                            />
                            <span className="text-xs font-bold text-slate-600">問せいかい！</span>
                          </div>
                        </div>

                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-700 text-xs">🔢 算数の結果</span>
                            <span className="text-xs text-slate-500">目標: {mathTarget}問</span>
                          </div>
                          <div className="flex items-center gap-3">
                            <input
                              type="number"
                              min="0"
                              max="10"
                              value={mathResult}
                              onChange={(e) => setMathResult(Number(e.target.value))}
                              className="w-20 p-2 text-center border border-slate-300 rounded-xl font-bold text-lg outline-none"
                            />
                            <span className="text-xs font-bold text-slate-600">問せいかい！</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <label className="font-bold text-xs text-slate-700 block flex items-center gap-1.5">
                        <Icons.Smile />
                        今回の振り返り
                      </label>
                      <textarea
                        value={reflection}
                        onChange={(e) => setReflection(e.target.value)}
                        placeholder="作戦通りに勉強できた！ / 次はやり方を変えてみよう！"
                        className="w-full p-3 border border-slate-200 rounded-2xl text-xs focus:ring-2 focus:ring-teal-500 outline-none h-24"
                      />
                    </div>

                    <button
                      onClick={handleSaveResult}
                      className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-2xl text-xs transition-all shadow-md flex items-center justify-center gap-2"
                    >
                      <Icons.CheckCircle2 />
                      結果を記録する
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 保護者画面 */}
            {mode === 'parent' && (
              <div className="space-y-6">
                {!isParentAuth ? (
                  <div className="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4 my-8">
                    <div className="flex items-center gap-3 border-b pb-3">
                      <div className="p-2 bg-amber-100 text-amber-700 rounded-2xl">
                        <Icons.Lock />
                      </div>
                      <div>
                        <h3 className="font-bold text-slate-800">{currentStudent.name} さんの保護者確認画面</h3>
                        <p className="text-xs text-slate-500">保護者パスワードを入力してください</p>
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">保護者パスワード</label>
                      <input
                        type="password"
                        value={parentPassInput}
                        onChange={(e) => setParentPassInput(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleParentAuth()}
                        placeholder="パスワードを入力"
                        className="w-full p-3 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>

                    <button
                      onClick={handleParentAuth}
                      className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-sm flex items-center justify-center gap-2"
                    >
                      確認画面に入る
                    </button>
                  </div>
                ) : (
                  <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                    <div className="flex items-center justify-between border-b pb-4">
                      <div className="flex items-center gap-3">
                        <span className="text-3xl">{currentStudent.avatar}</span>
                        <div>
                          <h2 className="font-bold text-lg text-slate-800">{currentStudent.name} さんの学習記録</h2>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h3 className="font-bold text-xs text-slate-700">これまでの取り組み</h3>
                      {[1, 2, 3].map(w => {
                        const rec = records[selectedStudentId]?.[w];
                        if (!rec) return null;
                        return (
                          <div key={w} className="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-3 text-xs">
                            <span className="font-bold text-emerald-700 block">第 {w} 回</span>
                            <div>漢字: 目標 {rec.kanjiTarget}問 ➔ 結果 {rec.kanjiResult ?? '未'}問</div>
                            <div>算数: 目標 {rec.mathTarget}問 ➔ 結果 {rec.mathResult ?? '未'}問</div>
                            {rec.strategy && <div className="text-slate-600">作戦: {rec.strategy}</div>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 先生画面 */}
            {mode === 'teacher' && (
              <div className="space-y-6">
                {!isTeacherAuth ? (
                  <div className="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-sm border border-emerald-100 space-y-4 my-8">
                    <div className="flex items-center gap-3 border-b pb-3">
                      <div className="p-2 bg-emerald-100 text-emerald-700 rounded-2xl">
                        <Icons.Lock />
                      </div>
                      <div>
                        <h3 className="font-bold text-slate-800">先生用画面 ログイン</h3>
                        <p className="text-xs text-slate-500">パスワードを入力してください</p>
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">先生パスワード</label>
                      <input
                        type="password"
                        value={teacherPassInput}
                        onChange={(e) => setTeacherPassInput(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleTeacherAuth()}
                        placeholder="パスワードを入力"
                        className="w-full p-3 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>

                    <button
                      onClick={handleTeacherAuth}
                      className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-sm flex items-center justify-center gap-2"
                    >
                      <Icons.UserCheck />
                      先生用画面に入る
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {/* タブ切り替え */}
                    <div className="flex bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200 text-xs font-bold gap-2">
                      <button
                        onClick={() => setTeacherTab('dashboard')}
                        className={`flex-1 py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 ${
                          teacherTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <Icons.UserCheck />
                        ダッシュボード（学習状況）
                      </button>
                      <button
                        onClick={() => setTeacherTab('settings')}
                        className={`flex-1 py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 ${
                          teacherTab === 'settings' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <Icons.Settings />
                        ⚙️ 児童名簿・パスワード設定
                      </button>
                    </div>

                    {/* ダッシュボード */}
                    {teacherTab === 'dashboard' && (
                      <div className="bg-white p-6 rounded-3xl shadow-sm border border-emerald-100 space-y-6">
                        <div className="flex items-center justify-between border-b pb-4">
                          <h2 className="font-bold text-lg text-slate-800">学級全児童の学習状況</h2>
                          <div className="flex items-center gap-2 text-xs">
                            <button onClick={() => setCurrentWeek(Math.max(1, currentWeek - 1))} className="px-2 py-1 bg-slate-100 rounded font-bold">◀ 前</button>
                            <span className="font-bold text-emerald-800">第 {currentWeek} 回</span>
                            <button onClick={() => setCurrentWeek(currentWeek + 1)} className="px-2 py-1 bg-slate-100 rounded font-bold">次 ▶</button>
                          </div>
                        </div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs border-collapse">
                            <thead>
                              <tr className="bg-slate-100 text-slate-700 font-bold">
                                <th className="p-3 rounded-l-xl">児童名</th>
                                <th className="p-3">漢字 (目標➔結果)</th>
                                <th className="p-3">算数 (目標➔結果)</th>
                                <th className="p-3">作戦・工夫</th>
                                <th className="p-3">振り返り</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {students.map(st => {
                                const rec = records[st.id]?.[currentWeek] || {};
                                return (
                                  <tr key={st.id} className="hover:bg-slate-50">
                                    <td className="p-3 font-bold">{st.name}</td>
                                    <td className="p-3">{rec.kanjiTarget ? `${rec.kanjiTarget}問 ➔ ${rec.kanjiResult ?? '未'}問` : '未設定'}</td>
                                    <td className="p-3">{rec.mathTarget ? `${rec.mathTarget}問 ➔ ${rec.mathResult ?? '未'}問` : '未設定'}</td>
                                    <td className="p-3 text-slate-600">{rec.strategy || '未入力'}</td>
                                    <td className="p-3 text-slate-600">{rec.reflection || '未入力'}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* オンライン設定管理 */}
                    {teacherTab === 'settings' && (
                      <div className="space-y-6">
                        {/* 先生パスワード変更 */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                          <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                            <Icons.Key />
                            先生用パスワードの変更
                          </h3>
                          <div className="flex gap-3 max-w-md">
                            <input
                              type="password"
                              value={newTeacherPass}
                              onChange={(e) => setNewTeacherPass(e.target.value)}
                              placeholder="新しいパスワードを入力"
                              className="flex-1 p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500"
                            />
                            <button
                              onClick={handleUpdateTeacherPass}
                              className="px-4 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700"
                            >
                              変更保存
                            </button>
                          </div>
                        </div>

                        {/* 児童名簿・保護者PASS設定（16名） */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                          <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                            <Icons.Users />
                            児童名簿・保護者パスワードの変更（全16名）
                          </h3>
                          <p className="text-xs text-slate-500">ここで名前を変更すると、画面上の児童リストへ即座に反映されます。</p>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {students.map(st => (
                              <div key={st.id} className="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                                <div className="flex items-center gap-2">
                                  <span className="text-xs font-bold text-slate-500 min-w-[28px]">{st.id}番</span>
                                  <input
                                    type="text"
                                    value={st.name}
                                    onChange={(e) => handleUpdateStudentInfo(st.id, e.target.value, st.parentPass)}
                                    placeholder="児童名を入力"
                                    className="flex-1 p-2 border border-slate-300 rounded-lg text-xs font-bold outline-none focus:ring-1 focus:ring-emerald-500"
                                  />
                                </div>
                                <div className="flex items-center gap-2 pl-9">
                                  <span className="text-[10px] font-bold text-slate-500">保護者PASS:</span>
                                  <input
                                    type="text"
                                    value={st.parentPass}
                                    onChange={(e) => handleUpdateStudentInfo(st.id, st.name, e.target.value)}
                                    placeholder="保護者PASS"
                                    className="w-32 p-1.5 border border-slate-300 rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500"
                                  />
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
